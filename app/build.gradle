plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.h2km33t.routeahead'
    compileSdk 37

    defaultConfig {
        applicationId "com.h2km33t.routeahead"
        minSdk 26
        targetSdk 37
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources.excludes += '/META-INF/{AL2.0,LGPL2.1}'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'

    // Compose. The BOM pins every compose artifact to one consistent set, which is why
    // the entries below carry no versions of their own.
    implementation platform('androidx.compose:compose-bom:2026.08.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'

    // GPS / location
    implementation 'com.google.android.gms:play-services-location:21.4.0'

    // Destination picker map (OSM-based, free, no API key)
    implementation 'org.osmdroid:osmdroid-android:6.1.20'

    // Coroutines - used to run network/OSRM calls off the main thread cleanly
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.11.0'

    // Plain JVM tests - the packet format and the routing maths have no Android
    // dependencies, so they run on `./gradlew test` without a device or emulator.
    testImplementation 'junit:junit:4.13.2'
}
